; PlatformIO project for the ARC fake-FC-N bridge on Teensy 4.1.
; The Teensy speaks the ARC protocol over Serial1 (pins 0/1) to the
; Pi's /dev/serial0, and exposes a friendly REPL on USB Serial.
;
; The arc_protocol library is pulled from GitHub (the single source of truth,
; pinned to a commit for reproducibility). During active co-development of the
; library you can switch the ref to #main, or point at a local checkout with a
; symlink:// path.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_filters = send_on_enter

; During active protocol co-development, use the local source of truth.
lib_deps = symlink://C:/Users/Drew/Documents/arc-protocol

; Larger USB serial buffer so paste-bombs of long commands don't drop.
build_flags =
    -DSERIAL_RX_BUFFER_SIZE=512
