; PlatformIO project for the ARC Teensy hub (the nosecone's central router).
;
; The Teensy 4.1 is the hub: every nosecone node is a UART spoke on it, and
; everything off-nosecone is forwarded to the Pi 5 (pi-5-nose) gateway. The
; arc_protocol C library is referenced by symlink from this repo's
; com-protocol/ folder, so changes to the C library show up on the next build
; with no copy step (same scheme as tools/fake-fc-teensy).

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200

lib_deps =
    symlink://../../com-protocol
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9

; Router needs room for 5 links (4 UART spokes + the data-radio transcode link)
; and the static route table. Defaults are 6/16, set explicitly for clarity.
build_flags =
    -DARC_ROUTER_MAX_LINKS=6
    -DARC_ROUTER_MAX_ROUTES=16

; Uncomment to enable SD black-box logging of every frame the hub sees.
; build_flags = ${env:teensy41.build_flags} -DHUB_SD_LOG
