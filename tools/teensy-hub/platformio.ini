; PlatformIO project for the ARC Teensy hub (the nosecone's central router).
;
; The Teensy 4.1 is the hub: every nosecone node is a UART spoke on it, and
; everything off-nosecone is forwarded to the Pi 5 (pi-5-nose) gateway. Serial1
; is reserved for the fixed non-ARC telemetry radio. The
; arc_protocol C library is pulled from GitHub (the single source of truth,
; pinned to a commit for reproducibility). Switch the ref to #main during active
; co-development of the library, or point at a local checkout with symlink://.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200

lib_deps =
    https://github.com/DrewBrandt/arc-protocol.git#bd6402612296493e94cc8927cab93c2bdb5eb573
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9

; Keep protocol/router helper capacities above the physical spoke count.
build_flags =
    -DARC_ROUTER_MAX_LINKS=10
    -DARC_ROUTER_MAX_ROUTES=16

[env:teensy41-sdlog]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -DHUB_SD_LOG

[env:teensy41-radio-bridge]
extends = env:teensy41
build_src_filter =
    +<radio_bridge.cpp>
build_flags =
    ${env:teensy41.build_flags}
    -DHUB_SERIAL_BRIDGE
    -DHUB_BRIDGE_SERIAL=HUB_DATA_RADIO_SERIAL
    -DHUB_BRIDGE_BAUD=HUB_DATA_RADIO_BAUD
    -DHUB_BRIDGE_LABEL=\"data-radio\"
